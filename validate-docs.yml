name: Validate Part 1 Docs Structure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing"
            exit 1
          fi
          echo "✓ /docs folder found"

      - name: Check required files exist
        run: |
          required_files=(
            "docs/RaceDay_ERD.md"
            "docs/API_Endpoint_Plan.md"
            "docs/RaceDay_Database.sql"
            "README.md"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing → $file"
              missing=1
            else
              echo "✓ Found $file"
            fi
          done
          if [ $missing -eq 1 ]; then
            exit 1
          fi

      - name: Validate SQL script contains CREATE TABLE statements
        run: |
          if ! grep -q "CREATE TABLE" docs/RaceDay_Database.sql; then
            echo "ERROR: RaceDay_Database.sql does not contain CREATE TABLE statements"
            exit 1
          fi
          echo "✓ SQL script contains CREATE TABLE statements"

      - name: Validate ERD mentions minimum entities
        run: |
          if ! grep -qi "Roles\|Users\|Events\|Categories\|Enrolments\|Results" docs/RaceDay_ERD.md; then
            echo "ERROR: ERD does not appear to document the core entities"
            exit 1
          fi
          echo "✓ ERD documents core entities"

      - name: Success
        run: echo "All Part 1 planning documents validated successfully."
